<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#0f2b5c"/>
      <stop offset="100%" stop-color="#020c1b"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded octagon / shield -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#navyGrad)" stroke="url(#cyanGrad)" stroke-width="2.5" />
  
  <!-- Subtle inner circuit accent -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6" />

  <!-- Monogram D and P merged modern geometry -->
  <!-- D letter left -->
  <path d="M 30 26 L 46 26 C 58 26 66 34 66 44 C 66 54 58 62 46 62 L 38 62 L 38 74 L 30 74 Z M 38 34 L 38 54 L 46 54 C 52 54 57 50 57 44 C 57 38 52 34 46 34 Z" fill="url(#cyanGrad)" filter="url(#glow)" />
  
  <!-- Accent dot/spark -->
  <circle cx="70" cy="30" r="4.5" fill="#38bdf8" />
  <circle cx="70" cy="30" r="2" fill="#ffffff" />
</svg>
